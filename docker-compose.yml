# 生产部署骨架（云服务器 Ubuntu + Docker）。P5 补 server 镜像构建后取消注释即整套起。
# 本机若暂不装 Docker，不影响开发（默认 profile 零中间件）。
services:
  db:
    image: pgvector/pgvector:pg16          # PG16 + pgvector，RAG 场景免二次扩展
    environment:
      POSTGRES_DB: agentflow
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password   # 密码走 secrets 文件，不入 compose 明文
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

