name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  server-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/agent-flow-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build & Test（全模块，测试失败即红）
        run: mvn -B verify

      - name: 配置口径冒断言（本地默认不得开启鉴权，防止误改默认值上线）
        # 锚定 agentflow.security 块里的下一行 enabled:，而不是整文件 grep——
        # 反向验过：旧写法在"auth 翻 true + 别处补一行 enabled: false"时仍 PASS（漏报）。
        # 允许两种绿色形态：字面 false，或 ${ENV:false}（默认值仍是 false）。true 的任意形态必须红。
        run: |
          awk '/^  security:[[:space:]]*$/{f=1;next} f && /^[[:space:]]*enabled:/{print;exit}' \
            server-application/src/main/resources/application.yml \
            | grep -Eq '^[[:space:]]*enabled:[[:space:]]*(\$\{[A-Za-z0-9_]+:[[:space:]]*)?false\}?[[:space:]]*(#.*)?$' \
            || { echo "agentflow.security.enabled 的本地默认不再是 false，阻断"; exit 1; }

      - name: 数据源口径冒断言（默认必须 PostgreSQL，H2 只允许留在测试里）
        # 为什么要单独钉：默认 profile 若退回文件库，"本地跑通"就不再等于"线上跑通"，
        # 而 24 个测试类各自 pin jdbc:h2:mem，CI 不会因此变红——这条是唯一的安全网。
        run: |
          if ! grep -Eq '^    url: \$\{PG_DB_URL:jdbc:postgresql' server-application/src/main/resources/application.yml; then
            echo "默认 datasource.url 不再是 PostgreSQL（本地与线上必须同一套数据源），阻断"; exit 1
          fi
          # 占位符名字也必须一致是 PG_DB_*：compose 的 env 与 docker-entrypoint.sh 的 *_FILE 白名单用的是同一组名字，
          # 任一处漂移的后果是容器形态拿不到口令（Flyway SCRAM 失败），而本地跑得一切正常。
          if grep -Eq '\$\{DB_(URL|USER|PASSWORD)[}:]' server-application/src/main/resources/application.yml; then
            echo "yml 里又出现旧名 DB_URL/DB_USER/DB_PASSWORD（应与 compose/entrypoint 一致用 PG_DB_*），阻断"; exit 1
          fi
          if grep -q 'org.h2.Driver' server-application/src/main/resources/application.yml; then
            echo "yml 里又出现 H2 驱动：H2 只允许出现在测试的 jdbc:h2:mem URL 里"; exit 1
          fi
          # 锚在 <groupId>com.h2database</groupId> 与它自己的 </dependency> 之间，不用 grep -A3：
          # 反向验过——旧写法在"补一行 <scope>runtime</scope> 但仍留着 test 那行"时漏报。
          if ! awk '/com\.h2database/{f=1} f{print} f&&/<\/dependency>/{exit}' server-application/pom.xml \
               | grep -q '<scope>test</scope>'; then
            echo "h2 不再是 test scope（runtime 带 H2 驱动＝给数据源退回文件库留后门），阻断"; exit 1
          fi
          if awk '/com\.h2database/{f=1} f{print} f&&/<\/dependency>/{exit}' server-application/pom.xml \
               | grep -Eq '<scope>(runtime|compile)</scope>'; then
            echo "h2 依赖块里出现 runtime/compile scope，阻断"; exit 1
          fi

      - name: 密钥泄漏扫描（禁止提交真实 key）
        run: |
          if grep -rEn "sk-[a-zA-Z0-9]{20,}" --include="*.yml" --include="*.json" --include="*.java" . ; then
            echo "疑似泄漏 API Key，阻断"; exit 1
          fi

  # web-build: P4 前端工程落地后启用
  #   needs: []
  #   steps: checkout → setup-node 22 → pnpm install --frozen-lockfile → pnpm build
