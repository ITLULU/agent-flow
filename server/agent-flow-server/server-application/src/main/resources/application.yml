server:
  port: 8080
  shutdown: graceful          # 生产口径：先排空在途请求再退出
  error:
    include-stacktrace: never # 双保险：即使 advice 漏网也不出栈

spring:
  application:
    name: agent-flow
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # 本地默认：H2 文件库（PostgreSQL 兼容模式），零外部中间件可启动；数据文件在 ./data（已 gitignore）
    url: jdbc:h2:file:./data/agentflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true         # liveness / readiness 分离，K8s 与 compose 健康检查均可用
      show-details: never
      group:
        # 探针必须真的反映依赖：只含 readinessState 时 DB 全灭依旧报 UP，编排层会被这个谎话骗到（评审 P6 #4）
        readiness:
          include: readinessState,db,ping
        # liveness 刻意不含 db：依赖抖动应摘流量+等待恢复，不该把进程重启掉（重启解决不了 DB 故障）
        liveness:
          include: livenessState
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

agentflow:
  security:
    # 三处一致口径之一：yml 默认 = 代码默认 = 文档。本地 false，prod profile 覆盖为 true
    enabled: false
    api-token: ${AGENTFLOW_API_TOKEN:}
    jwt-secret: ${AGENTFLOW_JWT_SECRET:}   # enabled=true 且此值为空 → 启动自检 fail-fast；本地 false 时可用 dev fallback
    master-key: ${AGENTFLOW_MASTER_KEY:}   # 凭证库 AES-GCM 主密钥（base64 32B）；缺失时凭证库报 A0400，其它功能不受影响
    master-key-previous: ${AGENTFLOW_MASTER_KEY_PREVIOUS:}   # 轮换期旧主密钥：只解密不加密，空=不启用双读
    token-ttl: 2h                          # JWT 有效期
    rate-limit-per-minute: 120             # 登录用户/服务通道各自的每分钟上限；显式 0=关掉整套限流（仅 enabled=true 生效）
    rate-limit-auth-per-minute: 30         # /api/auth/** 独立阈值，按客户端 IP 分桶：刷登录不能再拖垮服务通道与业务桶
    trust-forwarded-for: false             # 只有前面有会覆盖该头的可信反代时才打开，否则匿名桶会被伪造 XFF 绕过
    # 管理员只由运维显式注入（P7-2a：注册接口永不授予 admin，避免"谁先注册谁接管"）
    bootstrap-admin-username: ${AGENTFLOW_BOOTSTRAP_ADMIN_USERNAME:}
    bootstrap-admin-password: ${AGENTFLOW_BOOTSTRAP_ADMIN_PASSWORD:}   # 生产建议走 *_FILE 秘密注入
    metrics-token: ${AGENTFLOW_METRICS_TOKEN:}   # Prometheus 抓取专用令牌：仅对 /actuator/prometheus 生效，空=该端点保持 401
  nodes:
    # 凭证全部 env 注入（默认空串）：空凭证不阻塞启动，节点照常注册；执行时报不可重试的配置错误
    # 真实 key 需用户自行申请，见 docs/TOOLS-CHECKLIST.md
    llm:
      api-key: ${AI_API_KEY:${BAILIAN_API_KEY:}}   # AI_API_KEY 为统一入口；BAILIAN_API_KEY 保留兼容
      default-model: qwen-plus        # 节点可用 params.model 覆盖（多模型可配置口径）
    image:
      api-key: ${AI_API_KEY:${BAILIAN_API_KEY:}}   # 万相与 LLM 同源（DashScope）
      base-url: https://dashscope.aliyuncs.com
    wechat:
      app-id: ${WECHAT_APPID:}
      app-secret: ${WECHAT_SECRET:}
      base-url: https://api.weixin.qq.com
  content:
    # 成品库根目录：所有产物读写都被约束在此目录内（JdbcContentStore.resolveInside）。
    # 相对路径按进程工作目录解析；容器/云主机部署务必 env 指向持久卷，否则重启即丢成品。
    library-dir: ${AGENTFLOW_LIBRARY_DIR:./data/library}
    storage:
      # 成品 → 对象存储（S3 兼容：MinIO/OSS/AWS）副本同步（评审 P7-3#12b）。默认关：
      # 本地卷是交付面，远端只是"换实例/重建卷也不丢"的副本，不开时一个字节也不出网。
      # 开启后端点/桶/密钥必填且齐（否则启动即失败），密钥只从环境变量注入，永不写进 yml/compose 明文。
      enabled: ${AGENTFLOW_STORAGE_ENABLED:false}
      endpoint: ${AGENTFLOW_STORAGE_ENDPOINT:}
      bucket: ${AGENTFLOW_STORAGE_BUCKET:}
      region: ${AGENTFLOW_STORAGE_REGION:us-east-1}
      access-key: ${AGENTFLOW_STORAGE_ACCESS_KEY:}
      secret-key: ${AGENTFLOW_STORAGE_SECRET_KEY:}
      key-prefix: ${AGENTFLOW_STORAGE_KEY_PREFIX:artifacts}
      connect-timeout-ms: ${AGENTFLOW_STORAGE_CONNECT_TIMEOUT_MS:5000}
      request-timeout-ms: ${AGENTFLOW_STORAGE_REQUEST_TIMEOUT_MS:30000}
      sweep-interval-ms: ${AGENTFLOW_STORAGE_SWEEP_INTERVAL_MS:60000}
      sweep-initial-delay-ms: ${AGENTFLOW_STORAGE_SWEEP_INITIAL_DELAY_MS:15000}
  exec:
    # 执行闸门（评审 P7-3 #10）：容量/排队/等待上限运行期可调，应急扩缩不必重建镜像。
    # max-queued 是允许等待的条数：超过即 429，而不是无上限静默排队；0 表示只跑不排。
    max-concurrent: ${AGENTFLOW_EXEC_MAX_CONCURRENT:16}
    acquire-timeout: ${AGENTFLOW_EXEC_ACQUIRE_TIMEOUT:5m}
    max-queued: ${AGENTFLOW_EXEC_MAX_QUEUED:64}
    global-quota:
      # 跨实例全局执行配额（评审 P7-3 #11）：默认关。单实例时上面的 max-concurrent 就是全局上限，
      # 打开它等于多一张表、多一条事务；多实例部署时若不开，全集群同时在跑的是 16×实例数。
      # 名额记在共享库 execution_lease 表里，仲裁靠 quota_gate 哨兵行 FOR UPDATE；配额表缺失时
      # 执行直接失败（fail-closed），不会退化成"各数各的"。
      enabled: ${AGENTFLOW_EXEC_GLOBAL_QUOTA_ENABLED:false}
      # 全集群同时在跑的执行数上限；启用时必填且 >= 1（留空即启动失败）
      max-concurrent: ${AGENTFLOW_EXEC_GLOBAL_QUOTA_MAX_CONCURRENT:}
      # 单个归属人（workflow.owner_id）在集群里最多同时跑几条；0=只受全局上限约束
      per-user-max-concurrent: ${AGENTFLOW_EXEC_GLOBAL_QUOTA_PER_USER_MAX_CONCURRENT:0}
      # 租约 TTL 防实例崩溃不还名额；续租节拍必须明显小于 TTL，否则长执行会被当成崩溃残留抢走名额
      lease-ttl: ${AGENTFLOW_EXEC_GLOBAL_QUOTA_LEASE_TTL:10m}
      renew-interval: ${AGENTFLOW_EXEC_GLOBAL_QUOTA_RENEW_INTERVAL:30s}
      # 拿到本地槽后等集群名额的重试节拍，最长等待复用上面的 acquire-timeout
      reserve-retry-interval: ${AGENTFLOW_EXEC_GLOBAL_QUOTA_RESERVE_RETRY_INTERVAL:1s}
  engine:
    # 同一层（互不依赖的支路）并发上限：并行分支执行时同时活跃的节点数天花板。
    # 上限保护的是下游舱壁与进程连接/线程预算，调大不会让单节点变快，只会让抖动时更容易打穿依赖。
    max-parallel-nodes: ${AGENTFLOW_ENGINE_MAX_PARALLEL_NODES:8}
  resilience:
    # 下游依赖舱壁 + 熔断（评审 P7-3 #17）：进程内实现，多实例各自计数（见 README 限制）。
    # 只统计 C0001-C0003（连接/超时/协议）为依赖失败；A04xx 等客户端错误证明对端可达，会重置计数。
    enabled: ${AGENTFLOW_RESILIENCE_ENABLED:true}
    dependencies:
      llm:    { max-concurrent: 8, failure-threshold: 5,  open-duration: 30s }
      image:  { max-concurrent: 4, failure-threshold: 5,  open-duration: 30s }
      wechat: { max-concurrent: 4, failure-threshold: 3,  open-duration: 60s }
      xhs:    { max-concurrent: 4, failure-threshold: 3,  open-duration: 60s }
      web:    { max-concurrent: 8, failure-threshold: 10, open-duration: 30s }

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [traceId=%X{traceId:-}] %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: prod
  # 生产：PostgreSQL 16（云数据库或 compose 内 pgvector 容器），连接串/账号密码全部 env 注入，禁止写死
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 定容依据：峰值 100 QPS × 平均查询 20ms ≈ 2 并发连接，工作流执行写入另有异步闸门（Semaphore 16）；
      # 20 为单实例上限的稳妥值，多实例部署时按总连接数÷PG max_connections 重新分推（见 IMPLEMENTATION-PLAN §9）
      maximum-pool-size: 20
      connection-timeout: 3000
agentflow:
  security:
    enabled: true
    # prod 硬要求：AGENTFLOW_JWT_SECRET（≥ 32 字符随机串）与 AGENTFLOW_MASTER_KEY（base64 的 32B 主密钥）必须 env 注入；
    # 缺 JWT 密钥启动即失败，缺主密钥仅凭证库不可用（A0400 降级面容错）
  # nodes.* 继承默认段：prod 仍由同一组环境变量注入（BAILIAN_API_KEY/WECHAT_APPID/WECHAT_SECRET），
  # 差异仅在于云主机需出网白名单：dashscope.aliyuncs.com / api.weixin.qq.com（见 TOOLS-CHECKLIST 云服务段）
